modLoader = "javafml"
loaderVersion = "*"
license = "Apache-2.0"
licenseURL = "https://github.com/VidTu/HCsCR/raw/main/LICENSE"
issueTrackerURL = "https://github.com/VidTu/HCsCR/issues"

[[mods]]
modId = "hcscr"
version = "${version}"
displayName = "HCsCR"
updateJSONURL = "${forgeUpdaterUrl}"
displayURL = "https://modrinth.com/mod/hcscr"
issueTrackerURL = "https://github.com/VidTu/HCsCR/issues"
itemIcon = "end_crystal"
logoFile = "hcscr.png"
logoBlur = true
iconFile = "hcscr.png"
credits = "Offenderify, libffi"
authors = "VidTu"
description = "Remove your end crystals before the server even knows you hit 'em!"

[[mixins]]
config = "hcscr.mixins.json"

[[dependencies.hcscr]]
modId = "minecraft"
type = "required"
reason = "HCsCR works only with Minecraft ${minecraft}."
versionRange = "[${minecraft}]"
ordering = "NONE"
side = "CLIENT"

[[dependencies.hcscr]]
modId = "${platform}"
type = "required"
reason = "HCsCR requires an up-to-date '${platform}' to properly implement its functionality."
versionRange = "${constraints}"
ordering = "NONE"
side = "CLIENT"

[modproperties.hcscr]
catalogueImageIcon = "hcscr.png"
catalogueItemIcon = "end_crystal"
catalogueBackground = "hcscr_background.png"
